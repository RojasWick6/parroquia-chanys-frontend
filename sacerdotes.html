<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sacerdotes - Sistema Parroquial</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/personas.css">
</head>
<body class="pagina-interna">

  <header class="topbar">
    <h2>Sistema de Gestión Parroquial</h2>
    <div class="topbar-usuario">
      <span id="nombreUsuario"></span>
      <button id="btnLogout">Cerrar sesión</button>
    </div>
  </header>

  <main class="contenedor">
    <div class="encabezado-modulo">
      <h1>Sacerdotes</h1>
      <button id="btnNuevoSacerdote" class="btn-primario">+ Nuevo sacerdote</button>
    </div>

    <table class="tabla-datos">
      <thead>
        <tr>
          <th>Nombre completo</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="tablaSacerdotes"></tbody>
    </table>

    <p id="mensajeVacio" class="mensaje-vacio" style="display:none;">No hay sacerdotes registrados.</p>
  </main>

  <div id="modalSacerdote" class="modal-overlay" style="display:none;">
    <div class="modal-caja" style="max-width:400px;">
      <h2 id="modalTitulo">Nuevo sacerdote</h2>
      <form id="formSacerdote">
        <input type="hidden" id="sacerdoteId">
        <label for="nombre_completo">Nombre completo *</label>
        <input type="text" id="nombre_completo" required style="width:100%;padding:8px 10px;border:1px solid #ccc;border-radius:5px;margin-top:5px;">

        <p id="modalError" class="mensaje-error"></p>

        <div class="modal-botones">
          <button type="button" id="btnCancelar" class="btn-secundario">Cancelar</button>
          <button type="submit" class="btn-primario">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/sesion.js"></script>
  <script src="js/sacerdotes.js"></script>
</body>
</html>
