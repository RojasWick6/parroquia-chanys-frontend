<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personas - Sistema Parroquial</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/personas.css">
</head>
<body class="pagina-interna">

  <header class="topbar">
    <h2>Sistema de Gestión Parroquial</h2>
    <div class="topbar-usuario">
      <span id="nombreUsuario"></span>
      <button id="btnLogout">Cerrar sesión</button>
    </div>
  </header>

  <main class="contenedor">
    <div class="encabezado-modulo">
      <h1>Personas</h1>
      <button id="btnNuevaPersona" class="btn-primario">+ Nueva persona</button>
      <a href="boletas-lote.html" class="btn-secundario" style="text-decoration:none;display:inline-flex;align-items:center;">Imprimir boletas por lote</a>
    </div>

    <div class="barra-busqueda">
      <input type="text" id="inputBusqueda" placeholder="Buscar por nombre, apellido o CURP...">
    </div>

    <table class="tabla-datos">
      <thead>
        <tr>
          <th>Nombre completo</th>
          <th>Fecha de nacimiento</th>
          <th>CURP</th>
          <th>Teléfono</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="tablaPersonas">
        <!-- Se llena por JavaScript -->
      </tbody>
    </table>

    <p id="mensajeVacio" class="mensaje-vacio" style="display:none;">No se encontraron personas.</p>
  </main>

  <!-- Modal para crear/editar -->
  <div id="modalPersona" class="modal-overlay" style="display:none;">
    <div class="modal-caja">
      <h2 id="modalTitulo">Nueva persona</h2>
      <form id="formPersona">
        <input type="hidden" id="personaId">

        <div class="fila-form">
          <div>
            <label for="nombre">Nombre *</label>
            <input type="text" id="nombre" required>
          </div>
          <div>
            <label for="apellido_paterno">Apellido paterno *</label>
            <input type="text" id="apellido_paterno" required>
          </div>
          <div>
            <label for="apellido_materno">Apellido materno</label>
            <input type="text" id="apellido_materno">
          </div>
        </div>

        <div class="fila-form">
          <div>
            <label for="fecha_nacimiento">Fecha de nacimiento</label>
            <input type="date" id="fecha_nacimiento">
          </div>
          <div>
            <label for="lugar_nacimiento">Lugar de nacimiento</label>
            <input type="text" id="lugar_nacimiento">
          </div>
          <div>
            <label for="curp">CURP</label>
            <input type="text" id="curp" maxlength="18">
          </div>
        </div>

        <div class="fila-form">
          <div>
            <label for="nombre_padre">Nombre del padre</label>
            <input type="text" id="nombre_padre">
          </div>
          <div>
            <label for="nombre_madre">Nombre de la madre</label>
            <input type="text" id="nombre_madre">
          </div>
        </div>

        <div class="fila-form">
          <div>
            <label for="direccion">Dirección</label>
            <input type="text" id="direccion">
          </div>
          <div>
            <label for="telefono">Teléfono</label>
            <input type="text" id="telefono">
          </div>
        </div>

        <p id="modalError" class="mensaje-error"></p>

        <div class="modal-botones">
          <button type="button" id="btnCancelar" class="btn-secundario">Cancelar</button>
          <button type="submit" class="btn-primario">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/sesion.js"></script>
  <script src="js/personas.js"></script>
</body>
</html>
