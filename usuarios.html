<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Usuarios - Sistema Parroquial</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/personas.css">
  <link rel="stylesheet" href="css/expediente.css">
</head>
<body class="pagina-interna">

  <div class="app-shell">
    <button id="btnMenuMovil" class="btn-menu-movil" aria-label="Abrir menú">☰</button>


    <aside class="sidebar">
      <div class="sidebar-logo">
        <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
          <rect x="28" y="6" width="8" height="10" fill="currentColor"/>
          <rect x="24" y="10" width="16" height="4" fill="currentColor"/>
          <path d="M16 58 L16 30 L32 18 L48 30 L48 58 Z" fill="none" stroke="currentColor" stroke-width="2.5"/>
          <rect x="27" y="40" width="10" height="18" fill="currentColor"/>
          <rect x="30.5" y="26" width="3" height="10" fill="currentColor"/>
          <rect x="27" y="29.5" width="10" height="3" fill="currentColor"/>
        </svg>
        <div class="sidebar-logo-texto">
          <span>Sistema de Gestión</span>
          <strong>Parroquial</strong>
        </div>
      </div>

      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-item">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg>
          Dashboard
        </a>
        <a href="personas.html" class="nav-item">
          <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6"/><circle cx="17.5" cy="9" r="2.4"/><path d="M14.7 14.3c2.6-.3 4.8 1.9 5.3 5.3"/></svg>
          Personas
        </a>
        <a href="usuarios.html" class="nav-item nav-activo">
          <svg viewBox="0 0 24 24"><circle cx="10" cy="8.5" r="3.3"/><path d="M3.5 20c0-3.7 2.9-6.3 6.5-6.3s6.5 2.6 6.5 6.3"/><path d="M17 4.5v3M15.5 6h3"/></svg>
          Usuarios
        </a>
        <a href="auditoria.html" class="nav-item">
          <svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="1.5"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>
          Auditoría
        </a>
        <a href="configuracion.html" class="nav-item">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.2M12 18.8V21M21 12h-2.2M5.2 12H3M18.4 5.6l-1.5 1.5M7.1 16.9l-1.5 1.5M18.4 18.4l-1.5-1.5M7.1 7.1L5.6 5.6"/></svg>
          Configuración
        </a>

        <div class="nav-grupo">
          <span class="nav-grupo-titulo">Informes</span>
          <a href="boletas-lote.html" class="nav-item nav-item-sub">
            <svg viewBox="0 0 24 24"><rect x="5" y="9" width="14" height="7" rx="1"/><path d="M7 9V4h10v5M7 16v4h10v-4"/></svg>
            Imprimir por lote
          </a>
        </div>
      </nav>
    </aside>

    <div class="app-main">
      <header class="app-topbar">
        <h1>Usuarios</h1>
        <div class="topbar-usuario">
          <span id="nombreUsuario"></span>
          <button id="btnLogout">Cerrar sesión</button>
        </div>
      </header>

      <main class="app-contenido">
        <div class="encabezado-modulo">
          <button id="btnNuevoUsuario" class="btn-primario">+ Nuevo usuario</button>
        </div>

      <div class="tabla-scroll">
                <table class="tabla-datos">
                  <thead>
                    <tr>
                      <th>Nombre</th>
                      <th>Usuario</th>
                      <th>Rol</th>
                      <th>Estado</th>
                      <th>Acciones</th>
                    </tr>
                  </thead>
                  <tbody id="tablaUsuarios"></tbody>
                </table>
              </div>
      </main>
    </div>
  </div>

  <div id="modalUsuario" class="modal-overlay" style="display:none;">
    <div class="modal-caja" style="max-width:450px;">
      <h2 id="modalTitulo">Nuevo usuario</h2>
      <form id="formUsuario">
        <input type="hidden" id="usuarioId">

        <label for="nombre_completo">Nombre completo *</label>
        <input type="text" id="nombre_completo" required>

        <div id="campoUsuarioLogin">
          <label for="usuario_login">Nombre de usuario (login) *</label>
          <input type="text" id="usuario_login">
        </div>

        <div id="campoPassword">
          <label for="password">Contraseña (mínimo 6 caracteres) *</label>
          <input type="password" id="password">
        </div>

        <label for="rol">Rol *</label>
        <select id="rol" required>
          <option value="secretaria">Secretaria</option>
          <option value="admin">Administrador</option>
        </select>

        <div id="campoActivo" style="display:none;">
          <label style="display:flex;align-items:center;gap:8px;font-size:13px;margin-top:14px;">
            <input type="checkbox" id="activo" style="width:auto;"> Usuario activo
          </label>
        </div>

        <p id="modalError" class="mensaje-error"></p>

        <div class="modal-botones">
          <button type="button" id="btnCancelar" class="btn-secundario">Cancelar</button>
          <button type="submit" class="btn-primario">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <div id="modalPassword" class="modal-overlay" style="display:none;">
    <div class="modal-caja" style="max-width:400px;">
      <h2>Cambiar contraseña</h2>
      <form id="formPassword">
        <input type="hidden" id="passwordUsuarioId">
        <label for="passwordNuevo">Nueva contraseña (mínimo 6 caracteres) *</label>
        <input type="password" id="passwordNuevo" required>

        <p id="passwordError" class="mensaje-error"></p>

        <div class="modal-botones">
          <button type="button" id="btnCancelarPassword" class="btn-secundario">Cancelar</button>
          <button type="submit" class="btn-primario">Cambiar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/sesion.js"></script>
  <script src="js/nav-movil.js"></script>
  <script src="js/usuarios.js"></script>
</body>
</html>
