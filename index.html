<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Gestión Parroquial</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="fondo-login">
  <div class="patron-fondo"></div>

  <div class="login-container">
    <div class="login-box">
      <div class="login-marco">

        <div class="login-encabezado">
          <div class="icono-iglesia">
            <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
              <rect x="28" y="6" width="8" height="10" fill="currentColor"/>
              <rect x="24" y="10" width="16" height="4" fill="currentColor"/>
              <path d="M16 58 L16 30 L32 18 L48 30 L48 58 Z" fill="none" stroke="currentColor" stroke-width="2.5"/>
              <rect x="27" y="40" width="10" height="18" fill="currentColor"/>
              <rect x="30.5" y="26" width="3" height="10" fill="currentColor"/>
              <rect x="27" y="29.5" width="10" height="3" fill="currentColor"/>
            </svg>
          </div>
          <div class="titulo-texto">
            <span class="titulo-chico">Sistema de Gestión</span>
            <h1>Parroquial</h1>
          </div>
        </div>

        <p class="subtitulo">Inicia sesión para continuar</p>

        <form id="formLogin">
          <label for="usuario">Usuario</label>
          <input type="text" id="usuario" name="usuario" required autocomplete="username">

          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" required autocomplete="current-password">

          <button type="submit">Iniciar Sesión</button>

          <p id="mensajeError" class="mensaje-error"></p>
        </form>

      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
